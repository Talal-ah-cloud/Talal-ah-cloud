<svg width="1200" height="320"
     viewBox="0 0 1200 320"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07141d"/>
      <stop offset="50%" stop-color="#081923"/>
      <stop offset="100%" stop-color="#061118"/>
    </linearGradient>

    <!-- Cyan/Green -->
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00bfff"/>
    </linearGradient>

    <!-- Wave -->
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#003f52"/>
      <stop offset="50%" stop-color="#00615c"/>
      <stop offset="100%" stop-color="#00394e"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="smallGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid -->
    <pattern id="grid" width="80" height="60"
             patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 60"
            fill="none"
            stroke="#0b3b50"
            stroke-width="1"/>
    </pattern>

    <!-- Clip rounded corners -->
    <clipPath id="round">
      <rect x="5" y="5"
            width="1190"
            height="310"
            rx="25"/>
    </clipPath>

  </defs>

  <!-- ================= BACKGROUND ================= -->

  <g clip-path="url(#round)">

    <rect width="1200"
          height="320"
          fill="url(#bg)"/>

    <rect width="1200"
          height="320"
          fill="url(#grid)"
          opacity="0.55"/>

    <!-- Moving grid glow -->
    <rect x="-1200"
          y="0"
          width="1200"
          height="320"
          fill="url(#grid)"
          opacity="0.18">

      <animate
        attributeName="x"
        from="-1200"
        to="1200"
        dur="15s"
        repeatCount="indefinite"/>

    </rect>

    <!-- ================= LEFT NETWORK ================= -->

    <g stroke="#00ff88"
       stroke-width="2"
       fill="none"
       opacity="0.8">

      <path d="M80 90 L170 140 L260 85"
            stroke-dasharray="6 6">

        <animate
          attributeName="stroke-dashoffset"
          from="30"
          to="0"
          dur="2s"
          repeatCount="indefinite"/>

      </path>

    </g>

    <g fill="#00ff88"
       filter="url(#smallGlow)">

      <circle cx="80" cy="90" r="5">
        <animate
          attributeName="r"
          values="4;7;4"
          dur="2s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="170" cy="140" r="6">
        <animate
          attributeName="r"
          values="5;8;5"
          dur="1.8s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="260" cy="85" r="5">
        <animate
          attributeName="r"
          values="4;7;4"
          dur="2.3s"
          repeatCount="indefinite"/>
      </circle>

    </g>

    <!-- Moving left data particle -->

    <circle r="4"
            fill="#ffffff"
            filter="url(#smallGlow)">

      <animateMotion
        dur="3s"
        repeatCount="indefinite"
        path="M80 90 L170 140 L260 85"/>

    </circle>


    <!-- ================= RIGHT NETWORK ================= -->

    <g stroke="#00bfff"
       stroke-width="2"
       fill="none"
       opacity="0.85">

      <path d="M940 90 L1030 140 L1120 90"
            stroke-dasharray="6 6">

        <animate
          attributeName="stroke-dashoffset"
          from="30"
          to="0"
          dur="2s"
          repeatCount="indefinite"/>

      </path>

    </g>

    <g fill="#00bfff"
       filter="url(#smallGlow)">

      <circle cx="940" cy="90" r="5">
        <animate
          attributeName="r"
          values="4;7;4"
          dur="2s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="1030" cy="140" r="6">
        <animate
          attributeName="r"
          values="5;8;5"
          dur="1.8s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="1120" cy="90" r="5">
        <animate
          attributeName="r"
          values="4;7;4"
          dur="2.3s"
          repeatCount="indefinite"/>
      </circle>

    </g>

    <!-- Moving right data particle -->

    <circle r="4"
            fill="#ffffff"
            filter="url(#smallGlow)">

      <animateMotion
        dur="3s"
        repeatCount="indefinite"
        path="M940 90 L1030 140 L1120 90"/>

    </circle>


    <!-- ================= CLOUD ================= -->

    <g transform="translate(600 67)"
       stroke="url(#neon)"
       stroke-width="4"
       fill="none"
       filter="url(#glow)">

      <path d="
        M-43 14
        C-60 14 -67 2 -67 -10
        C-67 -24 -56 -35 -42 -36
        C-38 -53 -24 -63 -8 -63
        C8 -63 21 -54 27 -40
        C31 -42 37 -43 43 -43
        C60 -43 73 -30 73 -13
        C73 3 61 15 45 15
        Z">

        <animate
          attributeName="opacity"
          values="0.65;1;0.65"
          dur="2.2s"
          repeatCount="indefinite"/>

      </path>

      <!-- Lock -->

      <rect x="-13"
            y="-17"
            width="28"
            height="28"
            rx="4"/>

      <path d="
        M-7 -17
        V-27
        C-7 -38 9 -38 9 -27
        V-17"/>

      <circle cx="1"
              cy="-3"
              r="3"
              fill="#00ffbb"/>

    </g>


    <!-- ================= TITLE ================= -->

    <text x="600"
          y="155"
          text-anchor="middle"
          fill="#ffffff"
          font-family="Arial, Helvetica, sans-serif"
          font-size="39"
          font-weight="700"
          letter-spacing="1">

      TALAL AHMED ALAM

    </text>


    <!-- ================= ROLE ================= -->

    <text x="600"
          y="193"
          text-anchor="middle"
          fill="#00ff9d"
          font-family="monospace"
          font-size="20"
          font-weight="700"
          letter-spacing="2">

      ASPIRING CLOUD SECURITY ENGINEER

      <animate
        attributeName="opacity"
        values="0.7;1;0.7"
        dur="3s"
        repeatCount="indefinite"/>

    </text>


    <!-- ================= SKILLS ================= -->

    <text x="600"
          y="220"
          text-anchor="middle"
          fill="#8db3c7"
          font-family="monospace"
          font-size="13"
          letter-spacing="1">

      AWS  •  SECURITY  •  AUTOMATION  •  NETWORKING

    </text>


    <!-- ================= WAVES ================= -->

    <path
      d="
      M0 255
      Q100 215 200 260
      T400 255
      T600 260
      T800 250
      T1000 260
      T1200 250
      V320
      H0 Z"
      fill="#00485a"
      opacity="0.42">

      <animate
        attributeName="d"
        dur="7s"
        repeatCount="indefinite"
        values="
        M0 255 Q100 215 200 260 T400 255 T600 260 T800 250 T1000 260 T1200 250 V320 H0 Z;
        M0 265 Q100 235 200 250 T400 265 T600 250 T800 265 T1000 245 T1200 260 V320 H0 Z;
        M0 255 Q100 215 200 260 T400 255 T600 260 T800 250 T1000 260 T1200 250 V320 H0 Z"/>

    </path>


    <path
      d="
      M0 280
      Q120 245 240 275
      T480 275
      T720 280
      T960 270
      T1200 280
      V320
      H0 Z"
      fill="url(#wave)"
      opacity="0.6">

      <animate
        attributeName="d"
        dur="5s"
        repeatCount="indefinite"
        values="
        M0 280 Q120 245 240 275 T480 275 T720 280 T960 270 T1200 280 V320 H0 Z;
        M0 270 Q120 260 240 285 T480 265 T720 270 T960 285 T1200 270 V320 H0 Z;
        M0 280 Q120 245 240 275 T480 275 T720 280 T960 270 T1200 280 V320 H0 Z"/>

    </path>


    <!-- ================= SCANNER ================= -->

    <rect x="0"
          y="245"
          width="160"
          height="3"
          rx="2"
          fill="#00ff9d"
          filter="url(#glow)">

      <animate
        attributeName="x"
        from="-160"
        to="1200"
        dur="4s"
        repeatCount="indefinite"/>

    </rect>


    <!-- ================= BOTTOM TEXT ================= -->

    <text x="600"
          y="292"
          text-anchor="middle"
          fill="#607d8b"
          font-family="monospace"
          font-size="11"
          letter-spacing="6">

      SECURE • MONITOR • AUTOMATE • DEFEND

      <animate
        attributeName="fill"
        values="#607d8b;#00ff9d;#607d8b"
        dur="4s"
        repeatCount="indefinite"/>

    </text>


    <!-- Random glowing particles -->

    <g fill="#00ffbb"
       filter="url(#smallGlow)">

      <circle cx="340" cy="240" r="2">
        <animate
          attributeName="opacity"
          values="0;1;0"
          dur="2s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="870" cy="230" r="2">
        <animate
          attributeName="opacity"
          values="1;0;1"
          dur="2.5s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="300" cy="185" r="2">
        <animate
          attributeName="opacity"
          values="0;1;0"
          dur="3s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="900" cy="180" r="2">
        <animate
          attributeName="opacity"
          values="1;0;1"
          dur="2.8s"
          repeatCount="indefinite"/>
      </circle>

    </g>

  </g>

  <!-- Border -->

  <rect x="5"
        y="5"
        width="1190"
        height="310"
        rx="25"
        fill="none"
        stroke="#0b2836"
        stroke-width="2"/>

</svg>
